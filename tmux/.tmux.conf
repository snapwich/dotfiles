set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# fix terminal colors
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -ga terminal-overrides ",xterm-ghostty*:Tc"

# undercurl + colored underline passthrough
# xterm-256color (Windows Terminal/WSL) has no Smulx, so tmux downgrades
# undercurl to a plain underline. Single-colon form (4:3) is what Windows
# Terminal accepts; ghostty/kitty accept it too.
# Colons MUST be written as \072 -- tmux splits terminal-overrides entries on
# a literal ':' and would truncate the capability.
set-option -sa terminal-overrides ',*:Smulx=\E[4\072%p1%dm'
set-option -sa terminal-overrides ',*:Setulc=\E[58\0722\072\072%p1%{65536}%/%d\072%p1%{256}%/%{255}%&%d\072%p1%{255}%&%d%;m'

# fix for windows terminal adding escape characters on tmux load
# https://github.com/microsoft/terminal/issues/18600#issuecomment-2672186589
set -sg escape-time 100


# Enable OSC 52 clipboard
set -g set-clipboard on
set -g allow-passthrough on

# fixes autoread
set -g focus-events on

# split windows into the current path
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind-key S-Left swap-window -d -t -1
bind-key S-Right swap-window -d -t +1

bind-key y run-shell "printf '\\033]52;c;%s\\a' $(printf '%s' $(tmux display-message -p '#W') | base64 -w0) > #{pane_tty}"

# add gwtmux entries to the built-in window menu (prefix + <)
run-shell '~/.config/tmux/window-menu.sh'

# plugins
set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @plugin 'snapwich/tmux-flash'

# plugin set-option
set -g @tmux-dotbar-position top
set -g @tmux-dotbar-window-status-format " #I #W "

run '~/.config/tmux/plugins/tpm/tpm'
