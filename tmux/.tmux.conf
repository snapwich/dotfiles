set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

set -g automatic-rename-format '#{b:pane_current_path}'
bind-key N rename-window "#{pane_current_command}"

# fix terminal colors
set -g default-terminal "tmux-256color"
# Explicit array indices (not -a) so reloading this file overwrites the entries
# instead of appending duplicates. Indices start at 10 to leave tmux defaults.
set -s 'terminal-overrides[10]' 'xterm-256color:Tc'
set -s 'terminal-overrides[11]' 'xterm-ghostty*:Tc'

# OSC 8 hyperlinks: tmux only passes them through when the outer terminal has
# the hyperlinks feature, and the defaults do not give it to ghostty.
# Features are read on attach, so detach/reattach after changing this.
set -s 'terminal-features[10]' 'xterm-ghostty:hyperlinks'

# undercurl + colored underline passthrough
# xterm-256color (Windows Terminal/WSL) has no Smulx, so tmux downgrades
# undercurl to a plain underline. Single-colon form (4:3) is what Windows
# Terminal accepts; ghostty/kitty accept it too.
# Colons MUST be written as \072 -- tmux splits terminal-overrides entries on
# a literal ':' and would truncate the capability.
set -s 'terminal-overrides[12]' '*:Smulx=\E[4\072%p1%dm'
set -s 'terminal-overrides[13]' '*:Setulc=\E[58\0722\072\072%p1%{65536}%/%d\072%p1%{256}%/%{255}%&%d\072%p1%{255}%&%d%;m'

# fix for windows terminal adding escape characters on tmux load
# https://github.com/microsoft/terminal/issues/18600#issuecomment-2672186589
set -sg escape-time 100


# Enable OSC 52 clipboard
set -g set-clipboard on
set -g allow-passthrough on

# fixes autoread
set -g focus-events on

# split windows into the current path
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# record when each window last rang its bell (window_activity is the bell time here)
set-hook -g alert-bell 'set -wF @bell_time "#{window_activity}"'

# default choose-tree format, plus the gwtmux PR tag, window-status-bell-style colors and
# "(5m ago)" on windows with a bell. Formats have no "now", so save it in @now before the tree opens.
bind-key w set -gF @now '#{client_activity}' \; choose-tree -Zw -F '#{?pane_format,#{?pane_marked,#[reverse],}#{pane_current_command}#{?pane_active,*,}#{?pane_marked,M,}#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},: "#{pane_title}",},#{?window_format,#{?window_bell_flag,#[fg=#0B0E14 bg=#95E6CB bold],}#{?window_marked_flag,#[reverse],}#{window_name}#{window_flags}#{?@gwtmux_pr, #{@gwtmux_pr},}#{?#{&&:#{window_bell_flag},#{@bell_time}}, (#{?#{e|<:#{e|-:#{@now},#{@bell_time}},60},#{e|-:#{@now},#{@bell_time}}s,#{?#{e|<:#{e|-:#{@now},#{@bell_time}},3600},#{e|/:#{e|-:#{@now},#{@bell_time}},60}m#{e|m:#{e|-:#{@now},#{@bell_time}},60}s,#{e|/:#{e|-:#{@now},#{@bell_time}},3600}h#{e|/:#{e|m:#{e|-:#{@now},#{@bell_time}},3600},60}m}} ago),}#{?#{&&:#{==:#{window_panes},1},#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}}},: "#{pane_title}",},#{session_windows} windows#{?session_grouped, (group #{session_group}: #{session_group_list}),}#{?session_attached, (attached),}}}'

bind-key S-Left swap-window -d -t -1
bind-key S-Right swap-window -d -t +1

bind-key y run-shell "printf '\\033]52;c;%s\\a' $(printf '%s' $(tmux display-message -p '#W') | base64 -w0) > #{pane_tty}"

# rank panes by descendant RSS / CPU; enter=jump, C-x=kill pid, C-k=kill pane, C-t=toggle
bind-key M display-popup -E -w 90% -h 85% '~/.config/tmux/proc-tree.sh mem'
bind-key P display-popup -E -w 90% -h 85% '~/.config/tmux/proc-tree.sh cpu'

# add gwtmux entries to the built-in window menu (prefix + <)
run-shell '~/.config/tmux/window-menu.sh'

# plugins
set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @plugin 'snapwich/tmux-flash'

# plugin set-option
set -g @tmux-dotbar-position top
# gwtmux puts the PR of a worktree's branch in @gwtmux_pr ("#123")
set -g @tmux-dotbar-window-status-format " #{?@gwtmux_pr,#{@gwtmux_pr} ,}#W "

run '~/.config/tmux/plugins/tpm/tpm'
